[package]
publish = false
name = "trav-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Headless async BitTorrent engine"

[dependencies]
libc = "0.2"
tokio.workspace = true
thiserror.workspace = true
bytes.workspace = true
tracing.workspace = true
hex.workspace = true
reqwest.workspace = true
tokio-util.workspace = true
urlencoding.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
futures = "0.3"
sha1 = "0.11"
num-bigint = "0.5"
parking_lot = "0.12"
rand = "0.10"
base64 = "0.23"
fs4 = "1.1"
# Unicode normalization, for comparing file names as macOS volumes do (already
# in the tree through `url`).
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
igd-next = { version = "0.18", features = ["aio_tokio"] }
socket2 = "0.6.5"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
