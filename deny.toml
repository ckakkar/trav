# cargo-deny: supply-chain policy enforced in CI (`cargo deny check`).

[graph]
all-features = false

[advisories]
# RustSec advisories fail the build; unmaintained-crate notices in transitive
# GUI dependencies (GTK bindings pulled in by Tauri on Linux) are informational.
unmaintained = "workspace"
yanked = "deny"
# `zip` 4.x extraction bugs. tauri-plugin-updater depends on zip only on
# Windows (it unpacks .msi/.nsis updates there); Trav ships for macOS alone,
# where updates are .app.tar.gz and zip is never built. Drop these once a
# stable tauri-plugin-updater moves to zip >= 9.
ignore = [
  { id = "RUSTSEC-2026-0367", reason = "zip is a Windows-only dependency; Trav is macOS-only" },
  { id = "RUSTSEC-2026-0368", reason = "zip is a Windows-only dependency; Trav is macOS-only" },
  { id = "RUSTSEC-2026-0369", reason = "zip is a Windows-only dependency; Trav is macOS-only" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
