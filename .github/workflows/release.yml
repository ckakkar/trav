name: Release

# Every push to main that passes CI becomes a new version of Trav for macOS:
#   version  <major.minor from tauri.conf.json>.<number of commits on main>
#   assets   Trav.dmg (one universal download for Apple Silicon and Intel),
#            Trav.app.tar.gz + .sig (the signed update) and latest.json
# Installed copies read releases/latest/download/latest.json and update
# themselves. Needs the TAURI_SIGNING_PRIVATE_KEY secret; Apple Developer ID
# signing is optional (see CONTRIBUTING.md). Run it by hand to rebuild a commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  app:
    name: Trav for macOS
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          # The commit count is the version; the history is the release notes.
          fetch-depth: 0
          fetch-tags: true

      - name: Version
        id: v
        run: |
          base=$(node -p "require('./trav-gui/src-tauri/tauri.conf.json').version.split('.').slice(0, 2).join('.')")
          version="$base.$(git rev-list --count HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.v.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: trav-gui/package-lock.json
      - if: steps.v.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - if: steps.v.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: app-universal
      - if: steps.v.outputs.skip != 'true'
        run: npm ci
        working-directory: trav-gui

      # Developer ID signing and notarization, only when APPLE_CERTIFICATE is
      # set; without it the app is ad-hoc signed, as before. The certificate
      # goes into a throwaway keychain (not the bundler's own), so the disk
      # image can be signed and notarized after the build as well. A partial
      # set of secrets stops the release rather than shipping it unsigned.
      - name: Apple signing (optional)
        id: sign
        if: steps.v.outputs.skip != 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ]; then
            for k in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -n "${!k}" ]; then
                echo "::error::$k is set but APPLE_CERTIFICATE isn't. Add the certificate, or remove the Apple secrets to build ad-hoc signed."
                exit 1
              fi
            done
            echo "No APPLE_CERTIFICATE secret: building ad-hoc signed (users click Open Anyway once)."
            exit 0
          fi
          for k in APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!k}" ]; then
              echo "::error::APPLE_CERTIFICATE is set but $k is missing. Developer ID builds must be notarized too; see CONTRIBUTING.md."
              exit 1
            fi
          done

          kc="$RUNNER_TEMP/trav-signing.keychain-db"
          kcpass=$(openssl rand -hex 24)
          p12="$RUNNER_TEMP/trav-signing.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          if ! security import "$p12" -k "$kc" -f pkcs12 -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security; then
            rm -f "$p12"
            echo "::error::Couldn't import APPLE_CERTIFICATE. Check that it is the base64 of the .p12 and that APPLE_CERTIFICATE_PASSWORD is its export password."
            exit 1
          fi
          rm -f "$p12"
          # Apple's Developer ID intermediate, so codesign can build the chain
          # even if the runner image lacks it.
          if curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"; then
            security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$kc" >/dev/null 2>&1 || true
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "keychain=$kc" >> "$GITHUB_OUTPUT"

          identities=$(security find-identity -v -p codesigning "$kc")
          echo "$identities"
          identity="$APPLE_SIGNING_IDENTITY"
          if [ -z "$identity" ]; then
            identity=$(printf '%s\n' "$identities" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)
          fi
          if [ -z "$identity" ] || ! printf '%s\n' "$identities" | grep -qF "\"$identity\""; then
            echo "::error::No usable \"${identity:-Developer ID Application}\" identity in APPLE_CERTIFICATE. Export the certificate together with its private key (Keychain Access › My Certificates)."
            exit 1
          fi
          case "$identity" in
            "Developer ID Application: "*) ;;
            *) echo "::error::\"$identity\" isn't a Developer ID Application identity; apps outside the App Store need one."; exit 1 ;;
          esac

          for k in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            { echo "$k<<__END__"; echo "${!k}"; echo "__END__"; } >> "$GITHUB_ENV"
          done
          { echo "APPLE_SIGNING_IDENTITY<<__END__"; echo "$identity"; echo "__END__"; } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Signing as $identity, notarizing as team $APPLE_TEAM_ID."

      - name: Build (universal, with the signed update archive)
        if: steps.v.outputs.skip != 'true'
        working-directory: trav-gui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VERSION: ${{ steps.v.outputs.version }}
        run: npm run tauri build -- --target universal-apple-darwin --config "{\"version\":\"$VERSION\"}"

      # The bundler signs, notarizes and staples Trav.app (and so the update
      # archive made from it). The disk image people download gets the same
      # treatment here, and both are checked before anything is published.
      - name: Notarize the disk image and check the signatures
        if: steps.v.outputs.skip != 'true' && steps.sign.outputs.signed == 'true'
        working-directory: target/universal-apple-darwin/release/bundle
        run: |
          set -euo pipefail
          app=macos/Trav.app
          dmg=$(ls dmg/*.dmg | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp|Runtime)'
          xcrun stapler validate "$app"

          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$dmg"
          out=$(xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 30m --output-format json) || true
          echo "$out"
          status=$(printf '%s' "$out" | python3 -c 'import json,sys
          try: print(json.load(sys.stdin).get("status", ""))
          except Exception: print("")')
          if [ "$status" != "Accepted" ]; then
            id=$(printf '%s' "$out" | python3 -c 'import json,sys
          try: print(json.load(sys.stdin).get("id", ""))
          except Exception: print("")')
            [ -n "$id" ] && xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
            echo "::error::Apple didn't accept the disk image for notarization (status: ${status:-none}); its log is above."
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          # Gatekeeper's verdict, for the log (runners may have assessments off).
          spctl --assess --type execute --verbose=4 "$app" || true
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg" || true

      - name: Remove the signing keychain
        if: always() && steps.sign.outputs.keychain != ''
        run: security delete-keychain "${{ steps.sign.outputs.keychain }}" || true

      - name: Publish
        if: steps.v.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          b=target/universal-apple-darwin/release/bundle
          mkdir dist
          cp "$b"/dmg/*.dmg dist/Trav.dmg
          cp "$b/macos/Trav.app.tar.gz" dist/Trav.app.tar.gz
          cp "$b/macos/Trav.app.tar.gz.sig" dist/Trav.app.tar.gz.sig

          # What changed since the last release (or lately, for the first one).
          prev=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" >/dev/null; then
            range="$prev..HEAD"
          else
            range="-15"
          fi
          git log --no-merges --pretty='- %s' $range > notes.md
          [ -s notes.md ] || echo "- Maintenance release" > notes.md

          python3 scripts/latest-json.py --version "$VERSION" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/Trav.app.tar.gz" \
            --signature-file dist/Trav.app.tar.gz.sig --notes notes.md > dist/latest.json

          gh release create "v$VERSION" dist/* --target "$SHA" --title "Trav $VERSION" --notes-file notes.md --latest
