name: Release

# Every push to main that passes CI becomes a new version of Trav for macOS:
#   version  <major.minor from tauri.conf.json>.<number of commits on main>
#   assets   Trav.dmg (one universal download for Apple Silicon and Intel),
#            Trav.app.tar.gz + .sig (the signed update) and latest.json
# Installed copies read releases/latest/download/latest.json and update
# themselves. Needs the TAURI_SIGNING_PRIVATE_KEY secret; Apple Developer ID
# signing is optional (see CONTRIBUTING.md). Run it by hand to rebuild a commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  app:
    name: Trav for macOS
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          # The commit count is the version; the history is the release notes.
          fetch-depth: 0
          fetch-tags: true

      - name: Version
        id: v
        run: |
          base=$(node -p "require('./trav-gui/src-tauri/tauri.conf.json').version.split('.').slice(0, 2).join('.')")
          version="$base.$(git rev-list --count HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.v.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: trav-gui/package-lock.json
      - if: steps.v.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - if: steps.v.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: app-universal
      - if: steps.v.outputs.skip != 'true'
        run: npm ci
        working-directory: trav-gui

      # Developer ID signing and notarization, only when those secrets exist:
      # the bundler treats empty values as "sign with nothing" and fails.
      # Without them the app is ad-hoc signed.
      - name: Apple signing (optional)
        if: steps.v.outputs.skip != 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for k in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!k}" ]; then { echo "$k<<__END__"; echo "${!k}"; echo "__END__"; } >> "$GITHUB_ENV"; fi
          done

      - name: Build (universal, with the signed update archive)
        if: steps.v.outputs.skip != 'true'
        working-directory: trav-gui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VERSION: ${{ steps.v.outputs.version }}
        run: npm run tauri build -- --target universal-apple-darwin --config "{\"version\":\"$VERSION\"}"

      - name: Publish
        if: steps.v.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          b=target/universal-apple-darwin/release/bundle
          mkdir dist
          cp "$b"/dmg/*.dmg dist/Trav.dmg
          cp "$b/macos/Trav.app.tar.gz" dist/Trav.app.tar.gz
          cp "$b/macos/Trav.app.tar.gz.sig" dist/Trav.app.tar.gz.sig

          # What changed since the last release (or lately, for the first one).
          prev=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" >/dev/null; then
            range="$prev..HEAD"
          else
            range="-15"
          fi
          git log --no-merges --pretty='- %s' $range > notes.md
          [ -s notes.md ] || echo "- Maintenance release" > notes.md

          python3 scripts/latest-json.py --version "$VERSION" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/Trav.app.tar.gz" \
            --signature-file dist/Trav.app.tar.gz.sig --notes notes.md > dist/latest.json

          gh release create "v$VERSION" dist/* --target "$SHA" --title "Trav $VERSION" --notes-file notes.md --latest
