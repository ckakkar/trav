name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps to reproduce, expected vs actual behaviour.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and macOS version
      placeholder: "Trav 0.3.40 (Trav › About Trav), macOS 26.1"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "~/Library/Application Support/trav/logs/trav-desktop.*.log"
      render: text
