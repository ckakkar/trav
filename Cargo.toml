[workspace]
# The engine, and the macOS app that hosts it (trav-gui/src-tauri, macOS-only).
members = ["trav-core", "trav-gui/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Cyrus Kakkar <cyrus@kkrwhofrags.xyz>"]
repository = "https://github.com/ckakkar/trav"

[workspace.dependencies]
tokio = { version = "1.54", features = ["full"] }
thiserror = "2.0"
bytes = "1.12"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip"] }
tokio-util = { version = "0.7", features = ["codec"] }
urlencoding = "2.1"
url = "2.5"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
dirs = "7.0"

# Shipping builds: smaller, faster binaries. `cargo build --release`.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# Hashing dominates checks and verification; keep it fast in debug/test too.
[profile.dev.package.sha1]
opt-level = 3
